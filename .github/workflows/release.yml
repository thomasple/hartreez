name: Release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing version tag to publish (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs['release-tag'] }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs['release-tag'] }}
          persist-credentials: false

      - name: Confirm workflow was dispatched for the release tag
        env:
          RELEASE_TAG: ${{ inputs['release-tag'] }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$DISPATCH_REF" == "refs/tags/$RELEASE_TAG" ]]
          python3 - "$RELEASE_TAG" <<'PY'
          import pathlib
          import sys
          import tomllib

          tag = sys.argv[1]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match project version {version!r}")
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.17"

      - name: Install Python 3.10
        run: uv python install 3.10

      - name: Install locked development dependencies
        run: uv sync --locked --dev --python 3.10

      - name: Run tests
        run: uv run --no-sync --python 3.10 pytest

      - name: Check types
        run: uv run --no-sync --python 3.10 pyright

      - name: Build wheel and source distribution
        run: uv build --out-dir dist

      - name: Check distribution metadata
        run: uvx --from twine twine check --strict dist/*

      - name: Install and smoke-test built wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          [[ ${#wheels[@]} -eq 1 ]]
          [[ ${#sdists[@]} -eq 1 ]]

          uv venv --python 3.10 .release-venv
          python_bin="$PWD/.release-venv/bin/python"
          uv pip install --python "$python_bin" "${wheels[0]}"
          .release-venv/bin/hartreez --help
          "$python_bin" -c 'import hartreez; assert hartreez.convert(1, "m", "cm") == 100'

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hartreez-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/hartreez/
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hartreez-distributions
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hartreez/
    permissions:
      id-token: write
    steps:
      - name: Download the same validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hartreez-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
