[project]
name = "hartreez"
version = "0.2.0"
description = "Dependency-free atomistic unit conversion for numerical Python code"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thomas Plé", email = "thomas.ple@sorbonne-universite.fr" }
]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "units",
    "unit-conversion",
    "atomic-units",
    "atomistic",
    "molecular-dynamics",
    "physical-constants",
    "hartree",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/thomasple/hartreez"
Issues = "https://github.com/thomasple/hartreez/issues"
Documentation = "https://github.com/thomasple/hartreez/tree/main/docs"
Changelog = "https://github.com/thomasple/hartreez/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[project.scripts]
hartreez = "hartreez:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
